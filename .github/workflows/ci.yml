name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # 1. Run the Django test suite + system check
  # ----------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']

    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-xxxxxxxxxxxxxxxxxxxxx
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      # Use console email in CI so tests don't try to talk to Gmail
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system deps (Pillow needs these headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjpeg-dev zlib1g-dev libfreetype6-dev \
            liblcms2-dev libwebp-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --deploy || true
        # `check --deploy` emits warnings for dev settings (SSL etc.) — don't fail CI
        # on those; any REAL error (non-warning) would still `exit 1`.

      - name: Run migrations (fresh DB)
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test tests --noinput --verbosity 2

  # ----------------------------------------------------------------------
  # 2. Verify the Docker image builds cleanly
  # ----------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: kck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image starts
        run: |
          docker run --rm -d --name kck-ci \
            -e DEBUG=False \
            -e DJANGO_SECRET_KEY=ci-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e DJANGO_ALLOWED_HOSTS="*" \
            -p 8000:8000 \
            kck:ci
          # Give it up to 40s to finish migrations + collectstatic + launch gunicorn
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/accounts/login/ > /dev/null 2>&1; then
              echo "Container is serving ✓"; break
            fi
            sleep 1
          done
          # Final assertion
          curl -fsS http://localhost:8000/accounts/login/ > /dev/null
          docker logs kck-ci | tail -40
          docker stop kck-ci

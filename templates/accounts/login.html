{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-75">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-kck-blue">Welcome Back</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>
                        {% crispy form %}
                        <div class="text-center mt-4">
                            <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none small">Forgot password?</a>
                        </div>
                        <hr class="my-4">
                        <p class="text-center mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-semibold">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

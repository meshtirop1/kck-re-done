{% extends 'base.html' %}
{% block title %}Password Updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container" style="max-width: 520px;">
        <div class="card border-0 shadow-lg text-center">
            <div class="card-body p-5">
                <i class="bi bi-patch-check-fill" style="font-size: 4.5rem; color: var(--success);"></i>
                <h2 class="mt-3 mb-2">All set!</h2>
                <p class="text-muted">Your password has been updated. You can now sign in with your new password.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
